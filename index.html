<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Joe Viral | Maintenance Mode</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#050816;
      overflow:hidden;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    /* ANIMATED BACKGROUND */

    .stars{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:-1;
    }

    .star{
      position:absolute;
      width:2px;
      height:80px;
      background:linear-gradient(transparent,#00d9ff);
      opacity:.7;
      animation:fall linear infinite;
    }

    @keyframes fall{
      from{
        transform:translateY(-100px);
      }
      to{
        transform:translateY(120vh);
      }
    }

    /* MAIN BOX */

    .container{
      width:90%;
      max-width:800px;
      padding:60px 40px;
      text-align:center;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(15px);
      border-radius:30px;
      box-shadow:0 0 40px rgba(0,217,255,0.2);
      animation:float 4s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    .icon{
      font-size:90px;
      margin-bottom:20px;
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.1);
      }
      100%{
        transform:scale(1);
      }
    }

    h1{
      font-size:55px;
      margin-bottom:20px;
      color:#00d9ff;
    }

    p{
      font-size:18px;
      line-height:1.9;
      color:#d6d6d6;
      margin-bottom:40px;
    }

    /* LOADER */

    .loader{
      width:80px;
      height:80px;
      margin:0 auto 35px;
      border:6px solid rgba(255,255,255,0.1);
      border-top:6px solid #00d9ff;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    /* SOCIALS */

    .socials{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .socials a{
      text-decoration:none;
      color:white;
      padding:14px 24px;
      border-radius:40px;
      background:#0e1326;
      transition:.3s;
      border:1px solid rgba(255,255,255,0.1);
      font-weight:500;
    }

    .socials a:hover{
      background:#00d9ff;
      color:#000;
      transform:translateY(-5px);
    }

    /* MOBILE */

    @media(max-width:768px){

      .container{
        padding:40px 25px;
      }

      h1{
        font-size:38px;
      }

      p{
        font-size:15px;
      }

      .icon{
        font-size:70px;
      }

    }

  </style>
</head>

<body>

  <!-- STARS -->

  <div class="stars" id="stars"></div>

  <!-- MAIN CONTENT -->

  <div class="container">

    <div class="icon">🚧</div>

    <h1>Site Under Maintenance</h1>

    <div class="loader"></div>

    <p>
      Sorry for the inconvenience.<br><br>

      We are currently upgrading the Joe Viral portfolio website
      to deliver a better and more premium experience.<br><br>

      Please check back soon.
    </p>

    <div class="socials">

      <a href="https://wa.me/234XXXXXXXXXX" target="_blank">
        WhatsApp
      </a>

      <a href="https://www.instagram.com/" target="_blank">
        Instagram
      </a>

      <a href="https://www.tiktok.com/" target="_blank">
        TikTok
      </a>

    </div>

  </div>

  <!-- JAVASCRIPT -->

  <script>

    // STAR EFFECT

    const stars = document.getElementById("stars");

    for(let i = 0; i < 120; i++){

      let star = document.createElement("div");

      star.classList.add("star");

      star.style.left = Math.random() * window.innerWidth + "px";

      star.style.animationDuration =
      Math.random() * 3 + 2 + "s";

      star.style.opacity = Math.random();

      star.style.height =
      Math.random() * 100 + 50 + "px";

      stars.appendChild(star);
    }

  </script>

</body>
</html>ml>
